<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notes & Reminders PWA</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NotesRemind">
  <link rel="apple-touch-icon" href="/static/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="brand">
        <img src="/static/icons/icon.svg" alt="App Icon">
        <span>Notes & Reminders</span>
      </div>
      <div id="authNav" class="user-nav hidden">
        <button id="notifyBtn" class="btn btn-secondary btn-sm notify-btn" title="Toggle browser notifications">
          <span id="notifyIcon">🔔</span> <span id="notifyText">Alerts</span>
        </button>
        <span id="navUsername" class="user-pill"></span>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Log Out</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Offline status banner -->
    <div id="offlineBanner" class="alert alert-info hidden">
      ⚠️ You are offline. Cached views are accessible, but saving changes requires network.
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Auth Section (Login / Register) -->
    <section id="authSection" class="auth-box card">
      <div class="auth-header">
        <h1 id="authTitle">Sign In</h1>
        <p>Access your personal notes and reminders</p>
      </div>

      <div class="auth-toggle">
        <button id="toggleLoginBtn" class="active" type="button">Log In</button>
        <button id="toggleRegisterBtn" type="button">Register</button>
      </div>

      <div id="authError" class="alert alert-error hidden"></div>

      <form id="authForm">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" class="form-control" required placeholder="Choose a username" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" id="authSubmitBtn" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </section>

    <!-- App Dashboard Section -->
    <section id="appSection" class="hidden">
      <!-- Search Input (Thumb Friendly) -->
      <div class="search-container">
        <input type="search" id="searchInput" class="search-input" placeholder="🔍 Search notes, reminders & details..." autocomplete="off">
        <button id="searchClearBtn" class="search-clear-btn hidden" title="Clear search">&times;</button>
      </div>

      <!-- Active Tag Filter Indicator -->
      <div id="activeTagBanner" class="active-tag-banner hidden">
        <span>Filtered by tag: <strong id="activeTagName">#work</strong></span>
        <button id="clearTagBtn" class="btn btn-secondary btn-sm" style="padding: 0.15rem 0.5rem; min-height: 28px;">✕ Clear</button>
      </div>

      <!-- Filter toolbar (Horizontal scroll for mobile thumbs) -->
      <div class="toolbar-scroll">
        <button class="filter-btn active" data-filter="all">All Notes</button>
        <button class="filter-btn" data-filter="reminders">⏰ Reminders</button>
        <button class="filter-btn" data-filter="completed">✓ Completed</button>
        <button class="filter-btn" data-filter="archived">📦 Archive</button>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <span id="notesCount" style="font-size: 0.85rem; color: var(--text-muted);">0 notes</span>
      </div>

      <!-- Notes Grid -->
      <div id="notesGrid" class="notes-grid">
        <!-- Rendered dynamically via JavaScript -->
      </div>
      <div id="emptyNotesMsg" class="empty-state hidden">
        <p>No notes or reminders found in this view.</p>
      </div>
    </section>

    <!-- Floating Action Button (FAB) for Note Creation (Thumb Friendly) -->
    <button id="fabBtn" class="fab hidden" aria-label="Create Note or Reminder" title="Create Note or Reminder">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>

    <!-- Note Modal (Used for both Create & Edit) -->
    <div id="noteModal" class="modal-backdrop hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle" class="modal-title">Create Note or Reminder</h3>
          <button id="closeNoteModal" class="modal-close" aria-label="Close modal">&times;</button>
        </div>
        <form id="noteModalForm">
          <input type="hidden" id="modalNoteId">
          <div class="form-group">
            <label for="modalNoteTitle">Title *</label>
            <input type="text" id="modalNoteTitle" class="form-control" placeholder="What's on your mind or needs doing?" required>
          </div>
          <div class="form-group">
            <label for="modalNoteContent">Details (Plaintext)</label>
            <textarea id="modalNoteContent" class="form-control" placeholder="Add additional details, checklist items..."></textarea>
          </div>
          <div class="form-group">
            <label for="modalNoteDeadline">Reminder Deadline (Optional)</label>
            <input type="datetime-local" id="modalNoteDeadline" class="form-control">
          </div>
          <div class="form-group">
            <label for="modalNoteRecurrence">Repeat (Recurrence)</label>
            <select id="modalNoteRecurrence" class="form-control">
              <option value="none">Does not repeat</option>
              <option value="daily">Every Day (Daily)</option>
              <option value="weekly">Every Week (Weekly)</option>
              <option value="monthly">Every Month (Monthly)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modalNoteTags">Tags (Comma-separated)</label>
            <input type="text" id="modalNoteTags" class="form-control" placeholder="work, personal, urgent">
            <small style="color: var(--text-muted); font-size: 0.75rem;">e.g., work, personal, groceries</small>
          </div>
          <div id="modalCompletedGroup" class="form-group hidden" style="display: flex; align-items: center; gap: 0.65rem;">
            <input type="checkbox" id="modalIsCompleted" class="note-checkbox">
            <label for="modalIsCompleted" style="margin-bottom: 0; cursor: pointer; font-size: 0.95rem;">Mark as completed</label>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 0.65rem; margin-top: 1.25rem;">
            <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="saveModalBtn" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
